<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب — CineVerse</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <style>
    .auth-page { min-height: calc(100vh - var(--header-h)); display: grid; place-items: center; padding-block: var(--sp-10); }
    .auth-card {
      width: 100%; max-width: 480px; padding: var(--sp-8);
      background-color: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);
    }
    .auth-card__title { font-size: var(--fs-3xl); font-weight: var(--fw-extrabold); letter-spacing: -0.02em; margin-bottom: var(--sp-2); }
    .auth-card__title span { color: var(--brand); }
    .auth-card__subtitle { color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: var(--sp-6); }
    .form-field { margin-bottom: var(--sp-4); }
    .form-field__label { display: block; font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-secondary); margin-bottom: var(--sp-2); }
    .form-field__input {
      width: 100%; height: 46px; padding-inline: var(--sp-4);
      background-color: var(--bg-tertiary); border: 1px solid var(--border-strong);
      border-radius: var(--radius-md); color: var(--text-primary); font-size: var(--fs-base);
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .form-field__input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
    .form-field__error { color: var(--error); font-size: var(--fs-xs); margin-top: var(--sp-1); }
    .form-field__hint { color: var(--text-muted); font-size: var(--fs-xs); margin-top: var(--sp-1); }
    .form-alert {
      padding: var(--sp-3) var(--sp-4);
      background-color: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-md); color: #fca5a5;
      font-size: var(--fs-sm); margin-bottom: var(--sp-4); display: none;
    }
    .form-alert.is-visible { display: block; }
    .auth-card__footer {
      text-align: center; margin-top: var(--sp-6); padding-top: var(--sp-5);
      border-top: 1px solid var(--divider); font-size: var(--fs-sm); color: var(--text-muted);
    }
    .auth-card__footer a { color: var(--brand); font-weight: var(--fw-semibold); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="site-header__logo"><img src="assets/images/logo.svg" alt="CineVerse" width="180" height="42"></a>
    <div class="site-header__actions">
      <div id="header-user-slot"></div>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="container">
    <div class="auth-card">
      <h1 class="auth-card__title">حساب <span>جديد</span></h1>
      <p class="auth-card__subtitle">أنشئ حسابك للاستفادة من قوائم المشاهدة والمراجعات</p>

      <div class="form-alert" id="form-alert"></div>

      <form id="register-form" novalidate>
        <div class="form-field">
          <label class="form-field__label" for="display_name">الاسم المعروض</label>
          <input type="text" class="form-field__input" id="display_name" name="display_name" required autocomplete="name" minlength="2" maxlength="60">
          <div class="form-field__error" id="display_name-error"></div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="email">البريد الإلكتروني</label>
          <input type="email" class="form-field__input" id="email" name="email" required autocomplete="email" dir="ltr">
          <div class="form-field__error" id="email-error"></div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="password">كلمة المرور</label>
          <input type="password" class="form-field__input" id="password" name="password" required autocomplete="new-password" minlength="8" dir="ltr">
          <div class="form-field__hint">8 أحرف على الأقل</div>
          <div class="form-field__error" id="password-error"></div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="country">الدولة (اختياري)</label>
          <select class="form-field__input" id="country" name="country">
            <option value="">— اختر —</option>
          </select>
        </div>

        <button type="submit" class="btn btn--primary btn--lg btn--block" id="submit-btn">
          إنشاء الحساب
        </button>
      </form>

      <div class="auth-card__footer">
        لديك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/lang-switcher.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  'use strict';
  const api     = window.CineVerseAPI;
  const form    = document.getElementById('register-form');
  const alertEl = document.getElementById('form-alert');
  const submit  = document.getElementById('submit-btn');
  const countrySel = document.getElementById('country');

  function showAlert(msg) { alertEl.textContent = msg; alertEl.classList.add('is-visible'); }
  function clearAlert()   { alertEl.textContent = ''; alertEl.classList.remove('is-visible'); }
  function fieldError(id, msg) { const el = document.getElementById(id); if (el) el.textContent = msg || ''; }

  api.countries().then((payload) => {
    const countries = payload?.data || [];
    countries.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c.code;
      opt.textContent = `${c.flag_emoji || ''} ${c.name_ar || c.name_en}`.trim();
      countrySel.appendChild(opt);
    });
    countrySel.value = window.CineVerseI18n.getCountry() || '';
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();
    ['display_name-error', 'email-error', 'password-error'].forEach((id) => fieldError(id, ''));

    const display_name = form.display_name.value.trim();
    const email        = form.email.value.trim();
    const password     = form.password.value;
    const country      = form.country.value || null;
    const lang         = window.CineVerseI18n.getLang();

    let hasError = false;
    if (display_name.length < 2) { fieldError('display_name-error', 'الاسم قصير جدًا'); hasError = true; }
    if (!email)                  { fieldError('email-error', 'البريد الإلكتروني مطلوب'); hasError = true; }
    if (password.length < 8)     { fieldError('password-error', 'كلمة المرور يجب أن تكون 8 أحرف على الأقل'); hasError = true; }
    if (hasError) return;

    submit.disabled = true;
    submit.textContent = 'جارٍ إنشاء الحساب...';

    try {
      await window.CineVerseAuth.register({ email, password, display_name, country, lang });
      window.location.href = 'index.html';
    } catch (err) {
      showAlert(err.message || 'تعذر إنشاء الحساب');
      submit.disabled = false;
      submit.textContent = 'إنشاء الحساب';
    }
  });
})();
</script>
</body>
</html>
